<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <script src="./js/script.js" defer></script>
    <title>Calculator</title>
</head>
<body>
    <main>
        <div class="display">0</div>
        <div class="keyboard">
            <div class="row">
                    <button class="dark-button no-display">AC</button>
                    <button class="dark-button no-display">+/-</button>
                    <button class="dark-button no-display">%</button>
                    <button class="orange-button no-display">÷</button>
            </div>
            <div class="row">
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button class="orange-button no-display">x</button>
            </div>
            <div class="row">
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button class="orange-button no-display">-</button>
            </div>
            <div class="row">
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button class="orange-button no-display">+</button>
            </div>
            <div class="row">
                    <button class="double">0</button>
                    <button>.</button>
                    <button class="orange-button no-display">=</button>
            </div>
        </div>
    </main>
</body>
</html>
